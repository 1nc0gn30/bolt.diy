site_name: Zoth WebGen Docs
site_dir: ../site
theme:
  name: material
  palette:
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Dark mode active
  features:
    - navigation.tabs
    - navigation.sections
    - toc.follow
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
repo_name: zoth-webgen
repo_url: https://github.com/1nc0gn30/zoth-webgen
edit_uri: ''

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/1nc0gn30/zoth-webgen
      name: Neal Frazier Tech on GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/1nc0gn30
      name: Neal Frazier on X
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/bolt.diy
      name: bolt.diy on Bluesky

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables
  - def_list
  - admonition
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
